name: Fox Search Regression

on:
  pull_request:
    paths:
      - '.github/workflows/fox-search.yml'
      - 'pom.xml'
      - 'src/main/java/featurecat/lizzie/Config.java'
      - 'src/main/java/featurecat/lizzie/analysis/GetFoxRequest.java'
      - 'src/main/java/featurecat/lizzie/gui/**'
      - 'src/main/resources/l10n/**'
      - 'src/test/java/featurecat/lizzie/analysis/GetFoxRequestTest.java'
      - 'src/test/java/featurecat/lizzie/gui/FoxKifuDownload*Test.java'
      - 'src/test/java/featurecat/lizzie/gui/DesktopProbeProcess.java'
      - 'src/test/java/**/LocalizationResourceParityTest.java'

permissions:
  contents: read

concurrency:
  group: fox-search-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fox-search:
    name: Fox search (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.x'
      - name: Install Linux display dependencies
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth fonts-dejavu-core fonts-noto-cjk
      # The full Java lanes are headless and the desktop lane has an explicit test list.
      # Run the real Fox window on both platforms; do not count a skipped probe as coverage.
      - name: Run Linux Fox search regressions
        if: ${{ runner.os == 'Linux' }}
        env:
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
        run: >-
          xvfb-run -a -s '-screen 0 1920x1080x24 -nolisten tcp'
          mvn -B -Dfmt.skip=true -Djava.awt.headless=false
          -Dlizzie.desktop.required=true
          -Dlizzie.desktop.evidence.dir=target/fox-search/probes
          '-Dtest=GetFoxRequestTest,FoxKifuDownload*Test,LocalizationResourceParityTest' test
      - name: Run native Windows Fox search regressions
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: >-
          mvn -B '-Dfmt.skip=true' '-Djava.awt.headless=false'
          '-Dlizzie.desktop.required=true'
          '-Dlizzie.desktop.evidence.dir=target/fox-search/probes'
          '-Dtest=GetFoxRequestTest,FoxKifuDownload*Test,LocalizationResourceParityTest' test
      - name: Require executed keyboard traversal probe
        shell: python
        run: |
          from pathlib import Path
          import xml.etree.ElementTree as ET

          report = Path('target/surefire-reports/TEST-featurecat.lizzie.gui.FoxKifuDownloadAccessibilityTest.xml')
          cases = [case for case in ET.parse(report).getroot().iter('testcase')
                   if case.get('name') == 'searchChoicesRemainInTheKeyboardTraversalCycle']
          if len(cases) != 1 or any(cases[0].find(tag) is not None for tag in ('skipped', 'failure', 'error')):
              raise SystemExit('Fox keyboard traversal probe did not execute successfully')
          print('Fox keyboard traversal probe: executed, passed, not skipped')
      - name: Upload Fox search evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: fox-search-${{ matrix.os }}
          path: |
            target/surefire-reports
            target/fox-search
          if-no-files-found: warn
