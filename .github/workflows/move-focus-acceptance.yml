name: Native Windows Engine Acceptance

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-focus-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-focus:
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      KATAGO_PARAMETER_COMMIT: 57677bab9dc1db7d993eccd9f26b0e5ac0ed5570
      KATAGO_PARAMETER_REPOSITORY: https://github.com/22nsuk/KataGo
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: 22nsuk/KataGo
          ref: ${{ env.KATAGO_PARAMETER_COMMIT }}
          path: upstream-katago
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Select MSVC 14.44 x64 toolchain
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'MSVC C++ toolchain not found' }
          $command = '"' + $vs + '\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 -vcvars_ver=14.44 >nul && set'
          $variables = & cmd.exe /d /s /c $command
          if ($LASTEXITCODE -ne 0) { throw 'Locked MSVC environment unavailable' }
          $allowed = @('PATH', 'INCLUDE', 'LIB', 'LIBPATH', 'VCToolsVersion', 'VSCMD_ARG_TGT_ARCH', 'WindowsSDKVersion', 'WindowsSdkDir', 'VCToolsInstallDir', 'VCINSTALLDIR')
          foreach ($line in $variables) {
            $parts = $line -split '=', 2
            if ($parts.Count -eq 2 -and $parts[0] -in $allowed) {
              $line | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
          }
      - name: Identify native build inputs
        id: native-inputs
        shell: python
        run: |
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil
          import sys

          sys.path.insert(0, str(Path('scripts').resolve()))
          from build_katago_source import check_source

          check_source(Path('upstream-katago'), os.environ['KATAGO_PARAMETER_COMMIT'])
          inputs = {name: os.environ[name] for name in (
              'KATAGO_PARAMETER_COMMIT', 'KATAGO_PARAMETER_REPOSITORY',
              'ImageOS', 'ImageVersion', 'RUNNER_ARCH', 'RUNNER_TEMP', 'GITHUB_WORKSPACE',
              'VCToolsVersion', 'VCToolsInstallDir', 'WindowsSDKVersion', 'WindowsSdkDir',
              'INCLUDE', 'LIB', 'LIBPATH',
          )}
          inputs['tools'] = {}
          for name in ('cl.exe', 'link.exe', 'rc.exe', 'cmake.exe', 'ninja.exe'):
              executable = shutil.which(name)
              if executable is None:
                  raise RuntimeError(f'Required build tool is unavailable: {name}')
              with open(executable, 'rb') as handle:
                  digest = hashlib.file_digest(handle, 'sha256').hexdigest()
              inputs['tools'][name] = {'path': executable, 'sha256': digest}
          serialized = json.dumps(inputs, sort_keys=True, indent=2) + '\n'
          Path(os.environ['RUNNER_TEMP'], 'native-engine-cache-inputs.json').write_text(serialized, encoding='utf-8')
          fingerprint = hashlib.sha256(serialized.encode('utf-8')).hexdigest()
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'toolchain={fingerprint}\n')
      - name: Restore pinned CPU build outputs
        id: native-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Receipts contain absolute SDK paths; those paths are part of the fingerprint.
          # Never cache package audits or native acceptance results.
          path: |
            ${{ runner.temp }}/focus-sdk/prefix
            ${{ runner.temp }}/focus-sdk/build.log
            ${{ runner.temp }}/focus-build/katago.exe
            ${{ runner.temp }}/focus-build/source-build.json
            ${{ runner.temp }}/focus-build/source-licenses
            ${{ runner.temp }}/focus-build/CMakeCache.txt
            ${{ runner.temp }}/focus-build/build.log
          key: native-windows-cpu-v1-${{ env.KATAGO_PARAMETER_COMMIT }}-${{ steps.native-inputs.outputs.toolchain }}-${{ hashFiles('.github/workflows/move-focus-acceptance.yml', 'scripts/build_katago*.py', 'scripts/katago_windows_dependencies.json', 'scripts/katago_source_targets.py') }}
      - name: Build the pinned CPU engine on a cache miss
        if: steps.native-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          # A partial restore or interrupted download must not become build input.
          foreach ($directory in @('focus-sdk', 'focus-build')) {
            $path = Join-Path $env:RUNNER_TEMP $directory
            if (Test-Path $path) { Remove-Item -LiteralPath $path -Recurse -Force -ErrorAction Stop }
          }
          python scripts/build_katago_windows_dependencies.py --output "$env:RUNNER_TEMP/focus-sdk" --jobs 3
          if ($LASTEXITCODE -ne 0) { throw 'SDK failed' }
          python scripts/build_katago_source.py --source upstream-katago --output "$env:RUNNER_TEMP/focus-build" --source-commit "$env:KATAGO_PARAMETER_COMMIT" --source-repository "$env:KATAGO_PARAMETER_REPOSITORY" --target windows-cpu --windows-sdk "$env:RUNNER_TEMP/focus-sdk/prefix" --jobs 3
          if ($LASTEXITCODE -ne 0) { throw 'Engine build failed' }
      - name: Audit and package the pinned CPU engine
        shell: pwsh
        run: |
          python scripts/package_katago_source_windows.py --build "$env:RUNNER_TEMP/focus-build" --source-commit "$env:KATAGO_PARAMETER_COMMIT" --source-repository "$env:KATAGO_PARAMETER_REPOSITORY" --sdk "$env:RUNNER_TEMP/focus-sdk/prefix" --output "$env:RUNNER_TEMP/focus-engine"
          if ($LASTEXITCODE -ne 0) { throw 'Engine dependency audit failed' }
      - name: Exercise the real native application with the real engine
        shell: pwsh
        run: |
          $model = "$env:GITHUB_WORKSPACE/upstream-katago/cpp/tests/models/g170-b6c96-s175395328-d26788732.bin.gz"
          mvn -B '-Dfmt.skip=true' '-Djacoco.skip=true' '-Djava.awt.headless=false' '-Dlizzie.desktop.required=true' '-Dlizzie.focus.acceptance=true' "-Dlizzie.focus.engine=$env:RUNNER_TEMP/focus-engine/katago.exe" "-Dlizzie.focus.model=$model" '-Dlizzie.acceptance.engineGameParameters=true' "-Dlizzie.acceptance.engine=$env:RUNNER_TEMP/focus-engine/katago.exe" "-Dlizzie.acceptance.model=$model" '-Dtest=MoveFocusNativeAcceptanceIT,EngineGameParametersAcceptanceIT' test
          if ($LASTEXITCODE -ne 0) { throw 'Native engine acceptance failed' }
          [xml]$report = Get-Content 'target/surefire-reports/TEST-featurecat.lizzie.gui.MoveFocusNativeAcceptanceIT.xml'
          if ([int]$report.testsuite.tests -ne 1 -or [int]$report.testsuite.failures -ne 0 -or [int]$report.testsuite.errors -ne 0 -or [int]$report.testsuite.skipped -ne 0) {
            throw 'Required native case was missing, skipped, or failed'
          }
          [xml]$parameters = Get-Content 'target/surefire-reports/TEST-featurecat.lizzie.gui.EngineGameParametersAcceptanceIT.xml'
          if ([int]$parameters.testsuite.tests -ne 2 -or [int]$parameters.testsuite.failures -ne 0 -or [int]$parameters.testsuite.errors -ne 0 -or [int]$parameters.testsuite.skipped -ne 0) {
            throw 'Required dual-engine parameter cases were missing, skipped, or failed'
          }
      - name: Keep native evidence without claiming GPU acceptance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-focus-windows-${{ github.sha }}
          path: |
            target/desktop-smoke/probes/
            target/surefire-reports/
            ${{ runner.temp }}/focus-sdk/build.log
            ${{ runner.temp }}/focus-build/build.log
            ${{ runner.temp }}/focus-build/source-build.json
            ${{ runner.temp }}/focus-engine/source-package.json
            ${{ runner.temp }}/native-engine-cache-inputs.json
          if-no-files-found: error
          retention-days: 7
