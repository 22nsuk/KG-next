name: CI

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      acceptance_required: ${{ steps.acceptance.outputs.acceptance_required }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Verify CI acceptance policy
        run: python3 -m unittest discover -s scripts -p test_ci_acceptance.py
      - name: Select required CI execution from the complete PR diff
        id: acceptance
        run: python3 scripts/ci_acceptance.py plan
      - name: Run repository checks
        run: python3 scripts/run_local_ci.py --profile portable --group repository --require-clean --summary-dir target/local-ci/portable-repository
      - name: Upload local CI summary
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: local-ci-summary-portable-repository
          path: target/local-ci/portable-repository
          retention-days: 14
          if-no-files-found: warn

  script-tests:
    needs: repository-checks
    if: ${{ needs.repository-checks.outputs.acceptance_required == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Node for web protocol tests
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verify browser trial ownership protocol
        run: node --test scripts/test_web_trial_protocol.mjs
      - name: Prepare Linux product fixture isolation
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apparmor iproute2 nftables util-linux
          # Allow user namespaces for this CI copy without changing system unshare or global policy.
          sudo install -D -m 0755 /usr/bin/unshare /usr/local/lib/kg-next-ci/unshare
          sudo tee /etc/apparmor.d/kg-next-ci-unshare > /dev/null <<'PROFILE'
          abi <abi/4.0>,
          profile kg-next-ci-unshare /usr/local/lib/kg-next-ci/unshare flags=(unconfined) {
            userns,
          }
          PROFILE
          sudo apparmor_parser -r /etc/apparmor.d/kg-next-ci-unshare
          /usr/local/lib/kg-next-ci/unshare --user --map-root-user --net --fork sh -eu -c '
            cat /proc/self/attr/current
            ip link set lo up
            nft add table inet kg_next_ci_probe
            nft delete table inet kg_next_ci_probe
          '
      - name: Run portable script tests
        run: |
          export PATH="/usr/local/lib/kg-next-ci:$PATH"
          python3 scripts/run_local_ci.py --profile portable --group scripts --require-clean --summary-dir target/local-ci/portable-scripts
      - name: Upload local CI summary
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: local-ci-summary-portable-scripts
          path: target/local-ci/portable-scripts
          retention-days: 14
          if-no-files-found: warn

  windows-script-tests:
    needs: repository-checks
    if: ${{ needs.repository-checks.outputs.acceptance_required == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.x'
      - name: Verify CI acceptance policy on Windows
        shell: pwsh
        run: python -m unittest discover -s scripts -p test_ci_acceptance.py
      - name: Run Windows repository checks
        shell: pwsh
        run: python scripts/run_local_ci.py --profile windows --group repository --require-clean --summary-dir target/local-ci/windows-repository
      - name: Run Windows script tests
        shell: pwsh
        run: python scripts/run_local_ci.py --profile windows --group scripts --require-clean --summary-dir target/local-ci/windows-scripts
      - name: Upload repository summary
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: local-ci-summary-windows-repository
          path: target/local-ci/windows-repository
          retention-days: 14
          if-no-files-found: warn
      - name: Upload script summary
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: local-ci-summary-windows-scripts
          path: target/local-ci/windows-scripts
          retention-days: 14
          if-no-files-found: warn

  java-linux:
    needs: repository-checks
    if: ${{ needs.repository-checks.outputs.acceptance_required == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run Linux Java verification
        run: python3 scripts/run_local_ci.py --profile portable --group java --require-clean --summary-dir target/local-ci/portable-java
      - name: Upload local CI summary
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: local-ci-summary-portable-java
          path: target/local-ci/portable-java
          retention-days: 14
          if-no-files-found: warn
      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: jacoco-coverage-report-linux
          path: target/site/jacoco
          if-no-files-found: error

  # Keep full verification on Java 21; cover web and commentary HTTP boundaries on Java 17.
  java17-web:
    needs: repository-checks
    if: ${{ needs.repository-checks.outputs.acceptance_required == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify web message and commentary HTTP boundaries on Java 17
        run: >-
          mvn -B -Djava.awt.headless=true
          -Dtest=WebBoardHttpServerLifecycleTest,WebTrialMessageLifecycleTest,TeacherLlmClientTest,TeacherLlmStreamLimitsTest,TeacherResponseBudgetTest,GroundedCommentaryClientTest,TeacherRequestControllerTest
          test
      - name: Upload Java 17 test reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: java17-web-test-reports
          path: target/surefire-reports
          if-no-files-found: warn

  java-windows:
    needs: repository-checks
    if: ${{ needs.repository-checks.outputs.acceptance_required == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Set Windows diagnostic deadline
        shell: pwsh
        run: |
          $deadline = [DateTimeOffset]::UtcNow.AddMinutes(27).ToUnixTimeSeconds()
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "LIZZIE_CI_DEADLINE_UNIX_SECONDS=$deadline" -Encoding utf8
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.x'
      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run Windows Java verification
        shell: pwsh
        timeout-minutes: 25
        run: ./scripts/run_windows_ci_diagnostics.ps1
      - name: Upload Windows Java diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-java-diagnostics
          retention-days: 14
          path: |
            target/ci-diagnostics
            target/surefire-reports
            target/failsafe-reports
          if-no-files-found: warn
      - name: Upload local CI summary
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: local-ci-summary-windows-java
          path: target/local-ci/windows-java
          retention-days: 14
          if-no-files-found: warn
      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: jacoco-coverage-report-windows
          path: target/site/jacoco
          if-no-files-found: error

  desktop-smoke:
    needs: repository-checks
    if: ${{ needs.repository-checks.outputs.acceptance_required == 'true' }}
    runs-on: ubuntu-latest
    # Cover the 5-minute compile and 20-minute test budgets, plus setup/artifact upload.
    timeout-minutes: 28
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install display and font dependencies
        run: |
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,RUNNER_OS,RUNNER_ARCH python3 scripts/prefer_ubuntu_apt_mirror.py --install xvfb xauth openbox x11-utils fonts-dejavu-core fonts-noto-cjk fonts-thai-tlwg
      - name: Compile desktop smoke tests
        # Keep cold compilation outside the full pass and focused race repeats' budget.
        timeout-minutes: 5
        run: mvn -B -Dfmt.skip=true test-compile
      - name: Run Linux desktop smoke verification
        # Run every desktop feature once, then repeat worker/EDT and window-lifecycle races.
        timeout-minutes: 20
        env:
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
        run: |
          # The desktop probes also use 2x scaling; keep their 1180x820 logical window visible.
          xvfb-run -a -s '-screen 0 3840x2160x24 -nolisten tcp' bash -euo pipefail -c '
            mkdir -p target/desktop-smoke
            openbox --sm-disable > target/desktop-smoke/window-manager.log 2>&1 &
            wm_pid=$!
            cleanup() {
              kill "$wm_pid" 2>/dev/null || true
              wait "$wm_pid" 2>/dev/null || true
            }
            trap cleanup EXIT
            ready=false
            for attempt in {1..100}; do
              kill -0 "$wm_pid"
              if xprop -root _NET_SUPPORTING_WM_CHECK | grep -q "window id #"; then
                ready=true
                break
              fi
              sleep 0.1
            done
            if [[ "$ready" != true ]]; then
              cat target/desktop-smoke/window-manager.log
              exit 1
            fi
            python3 scripts/run_local_ci.py --profile portable --group desktop --require-clean \
              --summary-dir target/local-ci/portable-desktop/full
            for attempt in 1 2; do
              python3 scripts/run_local_ci.py --profile portable --group desktop-races --require-clean \
                --summary-dir "target/local-ci/portable-desktop/races-$attempt"
              mv target/desktop-smoke/races "target/desktop-smoke/races-$attempt"
            done
          '
      - name: Upload desktop smoke artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: desktop-smoke
          # Keep full-pass images and every repeat's machine-readable evidence.
          # A failed/cancelled run retains all images, including the unfinished races/ directory.
          path: |
            target/desktop-smoke
            ${{ job.status == 'success' && '!target/desktop-smoke/races-1/**/*.png' || '' }}
            ${{ job.status == 'success' && '!target/desktop-smoke/races-1/**/*.bmp' || '' }}
            ${{ job.status == 'success' && '!target/desktop-smoke/races-2/**/*.png' || '' }}
            ${{ job.status == 'success' && '!target/desktop-smoke/races-2/**/*.bmp' || '' }}
          retention-days: ${{ job.status == 'success' && 7 || 14 }}
          if-no-files-found: warn
      - name: Upload local CI summary
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: local-ci-summary-portable-desktop
          path: target/local-ci/portable-desktop
          retention-days: 14
          if-no-files-found: warn

  native-clipboard-macos:
    needs: repository-checks
    if: ${{ needs.repository-checks.outputs.acceptance_required == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify native pasteboard ownership and cross-process copying
        run: >-
          mvn -B -Djava.awt.headless=false -Dlizzie.desktop.required=true
          -Dtest=SgfCopyDesktopTest,ClipboardCopyTest test
      - name: Upload clipboard evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: native-clipboard-macos
          path: |
            target/surefire-reports
            target/desktop-smoke
          if-no-files-found: warn

  analysis-provenance-ui:
    needs: repository-checks
    if: ${{ needs.repository-checks.outputs.acceptance_required == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install analysis UI display dependencies
        run: |
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,RUNNER_OS,RUNNER_ARCH python3 scripts/prefer_ubuntu_apt_mirror.py --install xvfb xauth fonts-dejavu-core fonts-noto-cjk fonts-thai-tlwg
      - name: Run analysis provenance UI tests
        timeout-minutes: 7
        env:
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
        run: |
          xvfb-run -a -s '-screen 0 3840x2160x24 -nolisten tcp' \
            mvn -B -Dfmt.skip=true -Djacoco.skip=true -Djava.awt.headless=false -Dlizzie.desktop.required=true \
              -Dsurefire.reportsDirectory=target/provenance-ui/surefire-reports \
              -Dtest=WholeGameAnalysisDialogLayoutTest test
      - name: Require every analysis UI case to execute
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from scripts.run_local_ci import collect_junit_summary

          required_methods = (
              "runningMetadataFitsTheInitialDialogWithoutAnOrdinaryScrollbar",
              "localizedProgressAndControlsRemainVisibleAtCommonDpiScales",
              "customVisitSelectionShowsAnEditableBoundedValue",
              "startCommitsTypedCustomVisitsAndRejectsAnUncommittedOutOfRangeValue",
              "selectedReusePolicyReachesStartAndRejectsAnEstimateForTheOtherPolicy",
              "displayedPositionSourceRefreshesAndItsTimerStopsWhenHiddenOrDisposed",
          )
          summary = collect_junit_summary(
              Path("target/provenance-ui"),
              required_tests=tuple(
                  ("featurecat.lizzie.gui.WholeGameAnalysisDialogLayoutTest", method)
                  for method in required_methods
              ),
          )
          print(summary)
          PY
      - name: Upload analysis provenance UI artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: analysis-provenance-ui
          path: target/provenance-ui
          if-no-files-found: warn

  engine-process:
    needs: repository-checks
    if: ${{ needs.repository-checks.outputs.acceptance_required == 'true' }}
    name: Engine process (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-xvfb
            os: ubuntu-latest
            profile: portable
            summary: portable-engine-process
          - name: windows-native
            os: windows-latest
            profile: windows
            summary: windows-engine-process
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.x'
      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install Linux display dependencies
        if: ${{ runner.os == 'Linux' }}
        run: |
          # Bound acquisition, retry the existing alternate mirror, then install from cache.
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,RUNNER_OS,RUNNER_ARCH python3 scripts/prefer_ubuntu_apt_mirror.py --install xvfb xauth fonts-dejavu-core fonts-noto-cjk fonts-thai-tlwg
      - name: Run Linux engine process verification
        if: ${{ runner.os == 'Linux' }}
        timeout-minutes: 10
        env:
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
        run: xvfb-run -a -s '-screen 0 1920x1080x24 -nolisten tcp' python3 scripts/run_local_ci.py --profile ${{ matrix.profile }} --group engine-process --require-clean --summary-dir target/local-ci/${{ matrix.summary }}
      - name: Run native Windows engine process verification
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        timeout-minutes: 10
        run: python scripts/run_local_ci.py --profile ${{ matrix.profile }} --group engine-process --require-clean --summary-dir target/local-ci/${{ matrix.summary }}
      - name: Upload engine process artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: engine-process-${{ matrix.name }}
          path: target/engine-process-smoke
          if-no-files-found: warn
      - name: Upload local CI summary
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: local-ci-summary-${{ matrix.summary }}
          path: target/local-ci/${{ matrix.summary }}
          retention-days: 14
          if-no-files-found: warn

  fox-search:
    needs: repository-checks
    if: ${{ needs.repository-checks.outputs.acceptance_required == 'true' }}
    uses: ./.github/workflows/fox-search.yml

  b11-speed-notice:
    needs: repository-checks
    if: ${{ needs.repository-checks.outputs.acceptance_required == 'true' }}
    uses: ./.github/workflows/b11-speed-notice.yml

  native-windows:
    needs: repository-checks
    if: ${{ needs.repository-checks.outputs.acceptance_required == 'true' }}
    uses: ./.github/workflows/move-focus-acceptance.yml

  sgf-cpu-acceptance:
    needs: repository-checks
    if: ${{ needs.repository-checks.outputs.acceptance_required == 'true' }}
    uses: ./.github/workflows/acceptance-integration.yml

  # Server-side enforcement is configured separately; see docs/CI_MERGE_POLICY.md.
  ci-required:
    if: ${{ always() }}
    needs: [repository-checks, script-tests, windows-script-tests, java-linux, java17-web, java-windows, desktop-smoke, native-clipboard-macos, analysis-provenance-ui, engine-process, fox-search, b11-speed-notice, native-windows, sgf-cpu-acceptance]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Require all execution jobs
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci_acceptance.py check
