name: CI

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  change-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      fox-search: ${{ steps.scope.outputs.fox-search }}
      b11-speed-notice: ${{ steps.scope.outputs.b11-speed-notice }}
      native-focus: ${{ steps.scope.outputs.native-focus }}
      acceptance-integration: ${{ steps.scope.outputs.acceptance-integration }}
    steps:
      - name: Checkout the tested merge and its parents
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Select supplemental checks
        id: scope
        env:
          CI_EVENT: ${{ github.event_name }}
        run: python3 scripts/ci_merge_gate.py plan --event "$CI_EVENT" --output "$GITHUB_OUTPUT"

  repository-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Run repository checks
        run: python3 scripts/run_local_ci.py --profile portable --group repository --require-clean --summary-dir target/local-ci/portable-repository
      - name: Upload local CI summary
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: local-ci-summary-portable-repository
          path: target/local-ci/portable-repository
          if-no-files-found: warn

  script-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Node for web protocol tests
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verify browser trial ownership protocol
        run: node --test scripts/test_web_trial_protocol.mjs
      - name: Run portable script tests
        run: python3 scripts/run_local_ci.py --profile portable --group scripts --require-clean --summary-dir target/local-ci/portable-scripts
      - name: Upload local CI summary
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: local-ci-summary-portable-scripts
          path: target/local-ci/portable-scripts
          if-no-files-found: warn

  windows-script-tests:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.x'
      - name: Run Windows repository checks
        shell: pwsh
        run: python scripts/run_local_ci.py --profile windows --group repository --require-clean --summary-dir target/local-ci/windows-repository
      - name: Run Windows script tests
        shell: pwsh
        run: python scripts/run_local_ci.py --profile windows --group scripts --require-clean --summary-dir target/local-ci/windows-scripts
      - name: Upload repository summary
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: local-ci-summary-windows-repository
          path: target/local-ci/windows-repository
          if-no-files-found: warn
      - name: Upload script summary
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: local-ci-summary-windows-scripts
          path: target/local-ci/windows-scripts
          if-no-files-found: warn

  java-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run Linux Java verification
        run: python3 scripts/run_local_ci.py --profile portable --group java --require-clean --summary-dir target/local-ci/portable-java
      - name: Upload local CI summary
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: local-ci-summary-portable-java
          path: target/local-ci/portable-java
          if-no-files-found: warn
      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: jacoco-coverage-report-linux
          path: target/site/jacoco
          if-no-files-found: error

  # Keep full verification on Java 21; cover web and commentary HTTP boundaries on Java 17.
  java17-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify web message and commentary HTTP boundaries on Java 17
        run: >-
          mvn -B -Djava.awt.headless=true
          -Dtest=WebBoardHttpServerLifecycleTest,WebTrialMessageLifecycleTest,TeacherLlmClientTest,TeacherLlmStreamLimitsTest,TeacherResponseBudgetTest,GroundedCommentaryClientTest,TeacherRequestControllerTest
          test
      - name: Upload Java 17 test reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: java17-web-test-reports
          path: target/surefire-reports
          if-no-files-found: warn

  java-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Set Windows diagnostic deadline
        shell: pwsh
        run: |
          $deadline = [DateTimeOffset]::UtcNow.AddMinutes(27).ToUnixTimeSeconds()
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "LIZZIE_CI_DEADLINE_UNIX_SECONDS=$deadline" -Encoding utf8
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.x'
      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run Windows Java verification
        shell: pwsh
        timeout-minutes: 25
        run: ./scripts/run_windows_ci_diagnostics.ps1
      - name: Upload Windows Java diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-java-diagnostics
          retention-days: 14
          path: |
            target/ci-diagnostics
            target/surefire-reports
            target/failsafe-reports
          if-no-files-found: warn
      - name: Upload local CI summary
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: local-ci-summary-windows-java
          path: target/local-ci/windows-java
          if-no-files-found: warn
      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: jacoco-coverage-report-windows
          path: target/site/jacoco
          if-no-files-found: error

  desktop-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install display and font dependencies
        run: |
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,RUNNER_OS,RUNNER_ARCH python3 scripts/prefer_ubuntu_apt_mirror.py
          apt-config dump Acquire::Retries Acquire::http::Timeout Acquire::https::Timeout
          sudo apt-get update
          sudo apt-get install -y xvfb xauth openbox x11-utils fonts-dejavu-core fonts-noto-cjk fonts-thai-tlwg
      - name: Compile desktop smoke tests
        # Cold compilation must not consume the three full desktop passes' shared budget.
        timeout-minutes: 5
        run: mvn -B -Dfmt.skip=true test-compile
      - name: Run Linux desktop smoke verification
        # All three passes include the shutdown analysis and comment concurrency scenarios.
        timeout-minutes: 16
        env:
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
        run: |
          # The desktop probes also use 2x scaling; keep their 1180x820 logical window visible.
          xvfb-run -a -s '-screen 0 3840x2160x24 -nolisten tcp' bash -euo pipefail -c '
            mkdir -p target/desktop-smoke
            openbox --sm-disable > target/desktop-smoke/window-manager.log 2>&1 &
            wm_pid=$!
            cleanup() {
              kill "$wm_pid" 2>/dev/null || true
              wait "$wm_pid" 2>/dev/null || true
            }
            trap cleanup EXIT
            ready=false
            for attempt in {1..100}; do
              kill -0 "$wm_pid"
              if xprop -root _NET_SUPPORTING_WM_CHECK | grep -q "window id #"; then
                ready=true
                break
              fi
              sleep 0.1
            done
            if [[ "$ready" != true ]]; then
              cat target/desktop-smoke/window-manager.log
              exit 1
            fi
            for attempt in 1 2 3; do
              python3 scripts/run_local_ci.py --profile portable --group desktop --require-clean \
                --summary-dir "target/local-ci/portable-desktop/attempt-$attempt"
            done
          '
      - name: Upload desktop smoke artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: desktop-smoke
          path: target/desktop-smoke
          if-no-files-found: warn
      - name: Upload local CI summary
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: local-ci-summary-portable-desktop
          path: target/local-ci/portable-desktop
          if-no-files-found: warn

  analysis-provenance-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install analysis UI display dependencies
        run: |
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,RUNNER_OS,RUNNER_ARCH python3 scripts/prefer_ubuntu_apt_mirror.py
          apt-config dump Acquire::Retries Acquire::http::Timeout Acquire::https::Timeout
          sudo apt-get update
          sudo apt-get install -y xvfb xauth fonts-dejavu-core fonts-noto-cjk fonts-thai-tlwg
      - name: Run analysis provenance UI tests
        timeout-minutes: 7
        env:
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
        run: |
          xvfb-run -a -s '-screen 0 3840x2160x24 -nolisten tcp' \
            mvn -B -Dfmt.skip=true -Djava.awt.headless=false -Dlizzie.desktop.required=true \
              -Dsurefire.reportsDirectory=target/provenance-ui/surefire-reports \
              -Dtest=WholeGameAnalysisDialogLayoutTest test
      - name: Require every analysis UI case to execute
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from scripts.run_local_ci import collect_junit_summary

          required_methods = (
              "runningMetadataFitsTheInitialDialogWithoutAnOrdinaryScrollbar",
              "localizedProgressAndControlsRemainVisibleAtCommonDpiScales",
              "customVisitSelectionShowsAnEditableBoundedValue",
              "startCommitsTypedCustomVisitsAndRejectsAnUncommittedOutOfRangeValue",
              "selectedReusePolicyReachesStartAndRejectsAnEstimateForTheOtherPolicy",
              "displayedPositionSourceRefreshesAndItsTimerStopsWhenHiddenOrDisposed",
          )
          summary = collect_junit_summary(
              Path("target/provenance-ui"),
              required_tests=tuple(
                  ("featurecat.lizzie.gui.WholeGameAnalysisDialogLayoutTest", method)
                  for method in required_methods
              ),
          )
          print(summary)
          PY
      - name: Upload analysis provenance UI artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: analysis-provenance-ui
          path: target/provenance-ui
          if-no-files-found: warn

  engine-process:
    name: Engine process (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-xvfb
            os: ubuntu-latest
            profile: portable
            summary: portable-engine-process
          - name: windows-native
            os: windows-latest
            profile: windows
            summary: windows-engine-process
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.x'
      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install Linux display dependencies
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,RUNNER_OS,RUNNER_ARCH python3 scripts/prefer_ubuntu_apt_mirror.py
          apt-config dump Acquire::Retries Acquire::http::Timeout Acquire::https::Timeout
          sudo apt-get update
          sudo apt-get install -y xvfb xauth fonts-dejavu-core fonts-noto-cjk fonts-thai-tlwg
      - name: Run Linux engine process verification
        if: ${{ runner.os == 'Linux' }}
        timeout-minutes: 10
        env:
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
        run: xvfb-run -a -s '-screen 0 1920x1080x24 -nolisten tcp' python3 scripts/run_local_ci.py --profile ${{ matrix.profile }} --group engine-process --require-clean --summary-dir target/local-ci/${{ matrix.summary }}
      - name: Run native Windows engine process verification
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        timeout-minutes: 10
        run: python scripts/run_local_ci.py --profile ${{ matrix.profile }} --group engine-process --require-clean --summary-dir target/local-ci/${{ matrix.summary }}
      - name: Upload engine process artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: engine-process-${{ matrix.name }}
          path: target/engine-process-smoke
          if-no-files-found: warn
      - name: Upload local CI summary
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: local-ci-summary-${{ matrix.summary }}
          path: target/local-ci/${{ matrix.summary }}
          if-no-files-found: warn

  fox-search:
    needs: change-scope
    if: ${{ needs.change-scope.outputs.fox-search == 'true' }}
    uses: ./.github/workflows/fox-search.yml

  b11-speed-notice:
    needs: change-scope
    if: ${{ needs.change-scope.outputs.b11-speed-notice == 'true' }}
    uses: ./.github/workflows/b11-speed-notice.yml

  native-focus:
    needs: change-scope
    if: ${{ needs.change-scope.outputs.native-focus == 'true' }}
    uses: ./.github/workflows/move-focus-acceptance.yml

  acceptance-integration:
    needs: change-scope
    if: ${{ needs.change-scope.outputs.acceptance-integration == 'true' }}
    uses: ./.github/workflows/acceptance-integration.yml

  ci-required:
    if: ${{ always() }}
    needs: [repository-checks, script-tests, windows-script-tests, java-linux, java17-web, java-windows, desktop-smoke, analysis-provenance-ui, engine-process, change-scope, fox-search, b11-speed-notice, native-focus, acceptance-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Require all execution jobs
        env:
          REPOSITORY: ${{ needs.repository-checks.result }}
          SCRIPTS: ${{ needs.script-tests.result }}
          WINDOWS_SCRIPTS: ${{ needs.windows-script-tests.result }}
          JAVA_LINUX: ${{ needs.java-linux.result }}
          JAVA17_WEB: ${{ needs.java17-web.result }}
          JAVA_WINDOWS: ${{ needs.java-windows.result }}
          DESKTOP: ${{ needs.desktop-smoke.result }}
          ANALYSIS_UI: ${{ needs.analysis-provenance-ui.result }}
          ENGINE_PROCESS: ${{ needs.engine-process.result }}
        run: |
          printf '%s\n' "repository-checks=$REPOSITORY" "script-tests=$SCRIPTS" "windows-script-tests=$WINDOWS_SCRIPTS" "java-linux=$JAVA_LINUX" "java17-web=$JAVA17_WEB" "java-windows=$JAVA_WINDOWS" "desktop-smoke=$DESKTOP" "analysis-provenance-ui=$ANALYSIS_UI" "engine-process=$ENGINE_PROCESS"
          python3 - <<'PY'
          import os
          from scripts.run_local_ci import require_successful_job_results

          require_successful_job_results(
              {
                  "repository-checks": os.environ["REPOSITORY"],
                  "script-tests": os.environ["SCRIPTS"],
                  "windows-script-tests": os.environ["WINDOWS_SCRIPTS"],
                  "java-linux": os.environ["JAVA_LINUX"],
                  "java17-web": os.environ["JAVA17_WEB"],
                  "java-windows": os.environ["JAVA_WINDOWS"],
                  "desktop-smoke": os.environ["DESKTOP"],
                  "analysis-provenance-ui": os.environ["ANALYSIS_UI"],
                  "engine-process": os.environ["ENGINE_PROCESS"],
              }
          )
          PY
      - name: Require applicable supplemental checks
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci_merge_gate.py check
