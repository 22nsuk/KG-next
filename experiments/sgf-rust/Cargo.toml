[package]
name = "kg-sgf-rust-probe"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "GPL-3.0-only"
publish = false
autobins = false

[lib]
name = "kg_sgf_rust_probe"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "kg-sgf-rust-pipe"
path = "src/main.rs"

[workspace]
members = ["vendor/sgf"]
resolver = "3"

[dependencies]
sgf = { path = "vendor/sgf" }
