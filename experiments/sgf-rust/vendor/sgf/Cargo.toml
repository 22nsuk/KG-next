[package]
name = "sgf"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
license = "GPL-3.0-only"
publish = false

[dependencies]
encoding_rs = "0.8"
thiserror = "2"

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
